<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CostIQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#6B4226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CostIQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F3E8CF;--card:#FAF3E3;--soft:#FDF9EF;--brown:#6B4226;--ink:#3B2A1C;--mut:#8A7560;--line:#E3D3B1;--ok:#4C7A3A;--bad:#A8432E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;color:var(--brown);font-weight:800}
header small{color:var(--mut);font-size:11px}
main{flex:1;overflow-y:auto;padding:8px 12px 16px}
nav{display:flex;background:var(--brown);padding:5px 3px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#E8D8B8;font:inherit;font-size:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px}
nav button span{font-size:18px}
nav button.on{background:#FAF3E3;color:var(--brown);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.fh{display:flex;align-items:center;gap:6px;cursor:pointer}
.tri{color:var(--brown);font-size:14px;width:16px}
.bt{color:var(--brown);font-size:14px;font-weight:800}
.fh small{display:block;color:var(--mut);font-size:11px;margin-top:2px;font-weight:400}
.grid,.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:2fr 1.2fr 1.2fr;gap:6px}
.g3d{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:6px}
.g3x{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px}
.stat b{display:block;font-size:14px;margin-top:2px}.stat small{color:var(--mut);font-size:11px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:12px;padding:8px 2px;border-radius:9px;color:var(--mut)}
.seg button.on{background:var(--brown);color:#FAF3E3}
input,select{width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);margin-bottom:7px;min-width:0}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.btn{width:100%;border:0;background:var(--brown);color:#FAF3E3;font:inherit;font-weight:600;padding:11px;border-radius:12px;font-size:13px}
.btn.alt{background:var(--soft);color:var(--brown);border:1px solid var(--brown)}
.btn.red{background:var(--soft);color:var(--bad);border:1px solid var(--bad)}
.btn+.btn{margin-top:8px}
.g3x .btn{margin:0;padding:9px 2px;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border:0}.row small{color:var(--mut);display:block;font-size:11px}
.x{border:0;background:none;color:var(--bad);font-size:16px;padding:0 5px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:var(--brown);color:#FAF3E3;padding:6px 8px;font-weight:600}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:right}
tfoot td{font-weight:800;background:var(--soft)}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.prod{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;text-align:center;color:var(--ink)}
.prod b{display:block;font-size:13px}.prod small{color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}.bar div{height:100%;background:var(--brown)}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--brown);padding-top:4px}
.chart div{flex:1;background:var(--brown);border-radius:2px 2px 0 0;min-height:1px}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:14px 0}
.edit{background:var(--soft);border:1px solid var(--brown);border-radius:12px;padding:10px;margin:6px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#FAF3E3;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.dpb{width:100%;text-align:right;font:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);margin-bottom:7px}
.pn{color:var(--brown)}
.lg{width:26px;height:26px;border-radius:6px;vertical-align:middle;margin-left:8px}
#cal{position:fixed;inset:0;background:rgba(59,42,28,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#cb{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:340px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--brown)}
.ch button{border:1px solid var(--line);background:var(--soft);border-radius:10px;width:38px;height:36px;font-size:18px;color:var(--brown)}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw span{font-size:11px;color:var(--mut);padding:4px 0}
.cg button{border:0;background:var(--soft);border-radius:10px;height:38px;font:inherit;font-size:13px;color:var(--ink);padding:0}
.cg button.sel{background:var(--brown);color:#fff}.cg button.in{background:var(--line)}.cg button.td{outline:1px solid var(--brown)}
.cinfo{font-size:12px;color:var(--mut);text-align:center;margin:10px 0}
#modal{position:fixed;inset:0;background:rgba(59,42,28,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
#modal div{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:320px;text-align:center}
#modal p{margin:0 0 14px;font-size:14px}
</style>
</head>
<body>
<header><h1><img class="lg" id="lg" alt="">CostIQ</h1><small id="today"></small></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="cal" onclick="if(event.target===this)closeCal()"><div id="cb"></div></div>
<div id="modal"><div><p id="mt"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;background:none"><button class="btn red" onclick="mdl(1)">بله، حذف شود</button><button class="btn alt" onclick="mdl(0)">انصراف</button></div></div></div>
<script>
const KEY='sandwich_db_v2';
let db={shop:'ساندویچی من',mats:[],foods:[],buys:[],sales:[],exps:[]};
try{const s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s);
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const fy=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const money=n=>fa(Math.round(n))+' تومان';
const pc=n=>fa(Math.round(n*10)/10)+'٪';
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3800)}
function num(v){return Number(String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,''))||0}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const jump=id=>setTimeout(()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({block:'start'})},30);
/* modal confirm (browser confirm() is blocked in sandbox) */
let askFn=null;
function ask(m,f){askFn=f;$('#mt').textContent=m;$('#modal').style.display='flex'}
function mdl(ok){$('#modal').style.display='none';const f=askFn;askFn=null;if(ok&&f)f()}
/* ---- Jalali ---- */
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const g2=gm>2?gy+1:gy;let d=365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+t[gm-1];jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}return[jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const toJ=s=>{const p=s.split('-').map(Number);return g2j(p[0],p[1],p[2])};
const fd=s=>{const j=toJ(s);return fy(j[2])+' '+MN[j[1]-1]+' '+fy(j[0])};
const dim=(y,m)=>{if(m<7)return 31;if(m<12)return 30;const g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);return j[1]===12&&j[2]===30?30:29};
const p2=n=>String(n).padStart(2,'0');
function jp(id,s,oc){return `<button type="button" class="dpb" id="${id}" data-v="${s||today()}" ${oc?`data-oc="${oc}"`:''} onclick="openCal('${id}')">📅 ${fd(s||today())}</button>`}
const gj=id=>{const e=document.getElementById(id);return e?e.dataset.v:today()};
let cal=null;
function openCal(id,range){const v=range?rf:gj(id),j=toJ(v);cal={id,range:!!range,y:j[0],m:j[1],sel:v,a:range?rf:'',b:range?rt:''};drawCal();$('#cal').style.display='flex'}
function closeCal(){$('#cal').style.display='none';cal=null}
function calNav(d){cal.m+=d;if(cal.m>12){cal.m=1;cal.y++}if(cal.m<1){cal.m=12;cal.y--}drawCal()}
function drawCal(){
  const y=cal.y,m=cal.m,n=dim(y,m),g=j2g(y,m,1),off=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7;let h='';
  for(let i=0;i<off;i++)h+='<i></i>';
  for(let d=1;d<=n;d++){const gg=j2g(y,m,d),s=gg[0]+'-'+p2(gg[1])+'-'+p2(gg[2]);let c='';
    if(cal.range){if(s===cal.a||s===cal.b)c='sel';else if(cal.a&&cal.b&&s>cal.a&&s<cal.b)c='in'}else if(s===cal.sel)c='sel';
    if(s===today())c+=' td';h+=`<button type="button" class="${c}" onclick="pickDay('${s}')">${fy(d)}</button>`}
  $('#cb').innerHTML=`<div class="ch"><button type="button" onclick="calNav(-1)">›</button><b>${MN[m-1]} ${fy(y)}</b><button type="button" onclick="calNav(1)">‹</button></div><div class="cw">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cg">${h}</div>`
  +(cal.range?`<div class="cinfo">${cal.a?'از '+fd(cal.a):'ابتدا را انتخاب کنید'}${cal.b?' تا '+fd(cal.b):cal.a?' — حالا انتها را انتخاب کنید':''}</div><div class="g2"><button type="button" class="btn" onclick="applyRange()">تایید</button><button type="button" class="btn alt" style="margin:0" onclick="closeCal()">انصراف</button></div>`:`<div class="g2" style="margin-top:10px"><button type="button" class="btn alt" style="margin:0" onclick="pickDay(today())">امروز</button><button type="button" class="btn alt" style="margin:0" onclick="closeCal()">بستن</button></div>`);
}
function pickDay(s){
  if(cal.range){if(!cal.a||cal.b){cal.a=s;cal.b=''}else if(s<cal.a){cal.b=cal.a;cal.a=s}else cal.b=s;drawCal();return}
  const e=document.getElementById(cal.id);e.dataset.v=s;e.textContent='📅 '+fd(s);const oc=e.dataset.oc;closeCal();if(oc)Function(oc)();
}
function applyRange(){if(!cal.a)return toast('ابتدا یک روز را انتخاب کنید');rf=cal.a;rt=cal.b||cal.a;closeCal();render()}
/* ---- helpers ---- */
const U={'کیلو':['گرم',1000],'لیتر':['میلی‌لیتر',1000],'عدد':['عدد',1]};
const sub=m=>U[m.unit]||['',1];
const M=id=>db.mats.find(m=>m.id===id);
const unitSel=(cur,att)=>`<select ${att}>${Object.keys(U).map(u=>`<option ${u===cur?'selected':''}>${u}</option>`).join('')}</select>`;
const matOpts=s=>db.mats.map(m=>`<option value="${m.id}" ${m.id===s?'selected':''}>${esc(m.name)} (${m.unit})</option>`).join('');
const eb=(e,d)=>`<button class="x pn" onclick="${e}">✎</button><button class="x" onclick="${d}">✕</button>`;
const st=ev=>'event.stopPropagation();'+ev;
let col={};
function box(k,t,body,def=true,ex='',sm=''){const o=col[k]!==undefined?col[k]:def;return `<div class="card"><div class="fh" onclick="tg(this,'${k}')"><span class="tri">${o?'▾':'▸'}</span><div style="flex:1"><span class="bt">${t}</span>${sm?`<small>${sm}</small>`:''}</div>${ex}</div><div class="bd" style="display:${o?'block':'none'};margin-top:10px">${body}</div></div>`}
function tg(h,k){const b=h.nextElementSibling,o=b.style.display==='none';b.style.display=o?'block':'none';h.querySelector('.tri').textContent=o?'▾':'▸';col[k]=o}
/* ---- kardex ---- */
function kdx(m){
  const r=[{d:'0000',t:'موجودی اولیه',i:+m.init||0,p:+m.price||0}];
  db.buys.forEach(b=>b.lines.forEach(l=>{if(l.m===m.id)r.push({d:b.date,t:'خرید'+(b.sup?' - '+b.sup:''),i:l.q,p:l.p})}));
  db.sales.forEach(s=>{const q=s.use&&s.use[m.id];if(q)r.push({d:s.date,t:'مصرف در فروش',o:q})});
  r.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  let q=0,v=0,lp=+m.price||0,ti=0,to=0,mq=0;
  r.forEach((x,n)=>{
    if(x.i!=null){v+=x.i*x.p;q+=x.i;lp=x.p;x.ai=x.i*x.p;if(n>0)ti+=x.i}
    else{const a=q>0?v/q:lp;x.ao=x.o*a;v-=x.ao;q-=x.o;to+=x.o}
    x.q=q;x.v=v;if(q<mq)mq=q});
  return{rows:r,q,v,avg:q>0?v/q:lp,bought:ti,used:to,minq:mq};
}
const negMats=ids=>db.mats.filter(m=>(!ids||ids.includes(m.id))&&kdx(m).minq<-1e-6).map(m=>m.name);
const avg=id=>{const m=M(id);return m?kdx(m).avg:0};
const foodCost=f=>f.rec.reduce((t,r)=>t+r.q*avg(r.m),0);

/* ---- app shell ---- */
const tabs=[['mats','📦','مواد اولیه'],['foods','🥪','غذاها'],['sales','🧾','فروش'],['exps','💸','هزینه‌ها'],['rep','📊','گزارش'],['set','⚙️','تنظیمات']];
let tab='mats',pd={id:'',date:today(),sup:'',lines:[]},plE=-1,mEdit='',kx='',fEdit='',lEdit='',period='day',rf=today(),rt=today();
let sc=[],sdr={id:'',date:today(),tax:''},xe={id:'',cat:'',amount:'',date:today(),note:''};
const tj=toJ(today());let emy=tj[0],emm=tj[1];
function render(){
  const y=$('#app').scrollTop;
  $('#today').textContent=db.shop+' · '+fd(today());
  $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render();$('#app').scrollTop=0"><span>${t[1]}</span>${t[2]}</button>`).join('');
  $('#app').innerHTML=({mats:vMats,foods:vFoods,sales:vSales,exps:vExps,rep:vRep,set:vSet})[tab]();
  $('#app').scrollTop=y;
}

/* ---- materials ---- */
function vMats(){
  const ks=db.mats.map(m=>({m,k:kdx(m)})),tot=ks.reduce((t,x)=>t+x.k.v,0);
  if(!kx||!M(kx))kx=db.mats[0]?db.mats[0].id:'';
  const km=M(kx),kk=km&&kdx(km),pl=plE>=0?pd.lines[plE]:null;
  return box('m_xl','📥 اکسل',xlBar('mats'),false)
  +box('m_add','➕ ماده اولیه جدید',`<label>نام</label><input id="mn" placeholder="مثلاً سینه مرغ"><div class="g2"><div><label>واحد</label>${unitSel('کیلو','id="mu"')}</div><div><label>قیمت هر واحد (تومان)</label><input id="mp" inputmode="numeric"></div></div><label>موجودی اولیه (به همان واحد)</label><input id="mi" inputmode="decimal" value="0"><button class="btn" onclick="addMat()">ثبت ماده اولیه</button>`,false)
  +box('m_list','📦 مواد اولیه',db.mats.map(m=>mEdit===m.id?`<div class="edit"><label>نام</label><input id="en" value="${esc(m.name)}"><div class="g3"><div><label>واحد</label>${unitSel(m.unit,'id="eu"')}</div><div><label>قیمت</label><input id="ep" inputmode="numeric" value="${m.price}"></div><div><label>موجودی اولیه</label><input id="ei" inputmode="decimal" value="${m.init}"></div></div><div class="g2"><button class="btn" onclick="saveM('${m.id}')">ثبت</button><button class="btn alt" style="margin:0" onclick="mEdit='';render()">انصراف</button></div></div>`:`<div class="row"><div><b>${esc(m.name)}</b><small>${m.unit} · قیمت ${money(m.price)} · اولیه ${fa(m.init)}</small></div><span>${eb(`mEdit='${m.id}';render()`,`delMat('${m.id}')`)}</span></div>`).join('')||'<div class="empty">ماده‌ای ثبت نشده</div>')
  +box('m_buy',pd.id?'🧾 ویرایش فاکتور خرید':'🧾 فاکتور خرید',`<div id="pform"></div><label>تاریخ</label>${jp('pdt',pd.date)}<label style="margin-top:7px">فروشنده</label><input id="psp" value="${esc(pd.sup)}">
  ${db.mats.length?`<div class="g3"><div><label>ماده</label><select id="pm">${matOpts(pl&&pl.m)}</select></div><div><label>مقدار</label><input id="pq" inputmode="decimal" value="${pl?pl.q:''}"></div><div><label>قیمت واحد</label><input id="pp" inputmode="numeric" value="${pl?pl.p:''}"></div></div><button class="btn alt" onclick="addLine()">${plE>=0?'ثبت ویرایش ردیف':'+ افزودن به فاکتور'}</button>`:'<div class="empty">اول مواد اولیه را اضافه کنید</div>'}

  +box('r_sum','خلاصه',`<div class="grid"><div class="stat"><small>درآمد</small><b class="pos">${money(inc)}</b></div><div class="stat"><small>تعداد سفارشات</small><b>${fa(S.length)}</b></div><div class="stat"><small>هزینه مواد مصرفی</small><b class="neg">${money(cg)}</b></div><div class="stat"><small>هزینه‌های جاری</small><b class="neg">${money(ex)}</b></div><div class="stat"><small>مالیات</small><b class="neg">${money(tax)}</b></div><div class="stat"><small>سود خالص</small><b class="${net>=0?'pos':'neg'}">${money(net)}</b></div><div class="stat"><small>درصد سود کلی</small><b class="${net>=0?'pos':'neg'}">${inc?pc(net/inc*100):'—'}</b></div><div class="stat"><small>ارزش موجودی انبار</small><b>${money(w)}</b></div></div>`)
  +box('r_chart','📈 فروش ۳۰ روز اخیر',`<div class="chart">${dv.map(v=>`<div style="height:${v/dm*100}%"></div>`).join('')}</div><div class="row" style="border:0;font-size:11px;color:var(--mut)"><span>${fd(days[0])}</span><span>بیشترین: ${money(dm>1?dm:0)}</span><span>امروز</span></div>`)
  +box('r_top','🏆 ۱۰ غذای پرفروش',top.map((t,i)=>`<div style="margin-bottom:9px"><div class="row" style="border:0;padding:0"><span>${fa(i+1)}. ${esc(t[0])}</span><span>${fa(t[1].q)} عدد · ${money(t[1].t)}</span></div><div class="bar"><div style="width:${t[1].q/mx*100}%"></div></div></div>`).join('')||'<div class="empty">فروشی در این بازه نیست</div>');
}

/* ---- settings ---- */
function vSet(){
  return box('t_info','مشخصات',`<label>نام مغازه</label><input id="sn" value="${esc(db.shop)}"><button class="btn" onclick="db.shop=val('sn').trim()||db.shop;save();toast('ذخیره شد ✓');render()">ثبت نام مغازه</button>`)
  +box('t_bk','پشتیبان‌گیری',`<div style="font-size:12px;color:var(--mut);margin-bottom:10px">فایل پشتیبان با تاریخ امروز دانلود می‌شود. اطلاعات فقط روی همین دستگاه ذخیره است؛ مرتب بکاپ بگیرید.</div><button class="btn" onclick="backup()">⬇️ دریافت فایل پشتیبان</button><button class="btn alt" onclick="$('#rfile').click()">⬆️ بازیابی از فایل پشتیبان</button><input type="file" id="rfile" accept=".json,application/json" style="display:none" onchange="restore(this.files[0]);this.value=''">`)
  +`<button class="btn red" onclick="wipe()">حذف همه اطلاعات</button>`;
}
async function dl(name,data,type){
  try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data});toast('فایل آماده ذخیره شد ✓');return}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('فایل ساخته شد ✓')}catch(e){toast('دانلود ممکن نشد')}
}
function backup(){const [y,m,d]=today().split('-');dl('backup-'+today()+'.json',JSON.stringify({app:'sandwich-accounting',version:3,exported:new Date().toISOString(),...db},null,2),'application/json')}
function restore(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.mats)||!Array.isArray(j.foods)||!Array.isArray(j.sales))throw 0;
    ask('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟',()=>{db={shop:j.shop||'ساندویچی من',mats:j.mats,foods:j.foods,buys:j.buys||[],sales:j.sales,exps:j.exps||[]};save();toast('بازیابی شد ✓');render()})}catch(e){toast('فایل پشتیبان معتبر نیست')}};
  r.readAsText(f);
}
function wipe(){ask('همه اطلاعات پاک شود؟ این کار برگشت ندارد.',()=>{db={shop:db.shop,mats:[],foods:[],buys:[],sales:[],exps:[]};save();render()})}

/* ---- Excel ---- */
const xlBar=t=>`<div class="g3x"><button class="btn alt" onclick="xlT('${t}')">قالب اکسل</button><button class="btn alt" onclick="$('#xi_${t}').click()">ایمپورت اکسل</button><button class="btn" onclick="xlE('${t}')">اکسپورت اکسل</button></div><input type="file" id="xi_${t}" accept=".xlsx,.xls" style="display:none" onchange="xlI('${t}',this.files[0]);this.value=''"><div style="font-size:11px;color:var(--mut);margin-top:8px">ایمپورت: ردیف‌های هم‌نام به‌روزرسانی و ردیف‌های جدید اضافه می‌شوند.</div>`;
const H={mats:['نام','واحد','قیمت هر واحد','موجودی اولیه'],foods:['نام غذا','قیمت فروش','ماده اولیه','مقدار (گرم / میلی‌لیتر / عدد)']};
function matRows(){return db.mats.map(m=>({[H.mats[0]]:m.name,[H.mats[1]]:m.unit,[H.mats[2]]:m.price,[H.mats[3]]:m.init}))}
function foodRows(){const r=[];db.foods.forEach(f=>{if(!f.rec.length)r.push({[H.foods[0]]:f.name,[H.foods[1]]:f.price,[H.foods[2]]:'',[H.foods[3]]:''});f.rec.forEach(x=>{const m=M(x.m);if(m)r.push({[H.foods[0]]:f.name,[H.foods[1]]:f.price,[H.foods[2]]:m.name,[H.foods[3]]:+(x.q*sub(m)[1]).toFixed(3)})})});return r}
async function xlW(name,sheet,rows,hdr){
  if(!window.XLSX)return toast('کتابخانه اکسل بارگذاری نشد');
  const ws=XLSX.utils.json_to_sheet(rows,{header:hdr}),wb=XLSX.utils.book_new();ws['!cols']=hdr.map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,ws,sheet);
  await dl(name,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function xlT(t){
  const ex=t==='mats'?[{[H.mats[0]]:'سینه مرغ',[H.mats[1]]:'کیلو',[H.mats[2]]:250000,[H.mats[3]]:5},{[H.mats[0]]:'نان ساندویچی',[H.mats[1]]:'عدد',[H.mats[2]]:6000,[H.mats[3]]:50}]:[{[H.foods[0]]:'ساندویچ مرغ',[H.foods[1]]:120000,[H.foods[2]]:'سینه مرغ',[H.foods[3]]:100},{[H.foods[0]]:'ساندویچ مرغ',[H.foods[1]]:120000,[H.foods[2]]:'نان ساندویچی',[H.foods[3]]:1}];
  xlW(t==='mats'?'قالب-مواد-اولیه.xlsx':'قالب-غذاها.xlsx',t==='mats'?'مواد اولیه':'غذاها',ex,H[t]);
}
function xlE(t){t==='mats'?xlW('مواد-اولیه-'+today()+'.xlsx','مواد اولیه',matRows(),H.mats):xlW('غذاها-'+today()+'.xlsx','غذاها',foodRows(),H.foods)}
function xlI(t,f){
  if(!f)return;if(!window.XLSX)return toast('کتابخانه اکسل بارگذاری نشد');
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const g=(row,k)=>{const key=Object.keys(row).find(x=>String(x).includes(k));return key?row[key]:''};
    let n=0,bad=[];
    if(t==='mats'){rows.forEach(w=>{const nm=String(g(w,'نام')).trim();if(!nm)return;let u=String(g(w,'واحد')).trim();if(!U[u])u='کیلو';const o={name:nm,unit:u,price:num(g(w,'قیمت')),init:num(g(w,'موجودی'))},e=db.mats.find(m=>m.name===nm);if(e)Object.assign(e,o);else db.mats.push({id:uid(),...o});n++})}
    else{const seen={};rows.forEach(w=>{const nm=String(g(w,'نام غذا')).trim();if(!nm)return;let f=db.foods.find(x=>x.name===nm);if(!f){f={id:uid(),name:nm,price:0,rec:[]};db.foods.push(f)}const p=num(g(w,'قیمت'));if(p)f.price=p;const mn=String(g(w,'ماده')).trim();if(!seen[nm]){seen[nm]=1;n++;if(mn)f.rec=[]}if(!mn)return;const m=db.mats.find(x=>x.name===mn),q=num(g(w,'مقدار'));if(!m){if(!bad.includes(mn))bad.push(mn);return}f.rec.push({m:m.id,q:q/sub(m)[1]})})}
    save();render();toast(fa(n)+' مورد وارد شد ✓'+(bad.length?' · ماده نامعتبر: '+bad.join('، '):''));
  }catch(e){toast('فایل اکسل معتبر نیست')}};
  r.readAsArrayBuffer(f);
}
{const ic=document.querySelector('link[rel=apple-touch-icon]').href;$('#lg').src=ic;}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
